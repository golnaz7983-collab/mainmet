name: Diccorf realtime chat
on:
  workflow_dispatch:
  push:
    paths:
      - 'diccorf/realtime.js'
      - '.github/workflows/diccorf-realtime.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire realtime client into Diccorf
        shell: python
        run: |
          from pathlib import Path
          p=Path('diccorf/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="realtime.js?v=1"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>')
              p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diccorf/index.html
          git diff --cached --quiet || git commit -m 'Enable Diccorf realtime two-way chat'
          git push
