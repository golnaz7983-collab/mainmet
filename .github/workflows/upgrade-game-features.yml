# v2
name: Upgrade game features
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('play.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('function tex(base,accent,seed=1,size=2048)', 'function tex(base,accent,seed=1,size=4096)')
          s=s.replace('const cowTex=tex("#6b472c","#3e2818",91,1024);', 'const cowTex=tex("#6b472c","#3e2818",91,2048);')
          s=s.replace('const sheepTex=tex("#e8e7df","#b9b9b3",103,1024);', 'const sheepTex=tex("#e8e7df","#b9b9b3",103,2048);')
          s=s.replace('2048×2048 BLOCK TEXTURES • 1024×1024 MOB TEXTURES','4096×4096 BLOCK TEXTURES • 2048×2048 MOB TEXTURES')
          marker='/* ===== MAINMET_FEATURE_UPGRADE_V2 ===== */'
          if marker not in s:
            patch=r'''<script>
          /* ===== MAINMET_FEATURE_UPGRADE_V2 ===== */
          (()=>{
            const $=id=>document.getElementById(id);
            const hud=document.createElement('div');hud.id='survivalHud';hud.innerHTML='<span id="hpHud">❤❤❤❤❤❤❤❤❤❤</span><span id="foodHud">🍗🍗🍗🍗🍗🍗🍗🍗🍗🍗</span>';hud.style.cssText='position:fixed;z-index:28;left:50%;bottom:82px;transform:translateX(-50%);display:none;background:#111c;border:2px solid #555;border-radius:4px;padding:4px 8px;font-size:19px;line-height:1;text-shadow:2px 2px #000;direction:ltr;pointer-events:none;white-space:nowrap';document.body.appendChild(hud);
            const style=document.createElement('style');style.textContent='#survivalHud #hpHud{color:#e33;margin-right:10px}#survivalHud #foodHud{color:#e7b84f}#dropToast{position:fixed;z-index:150;left:50%;top:18%;transform:translateX(-50%);background:#111e;color:#fff;border:2px solid #777;border-radius:5px;padding:8px 12px;display:none;font-weight:900}#craftBox{margin-top:8px;padding:10px;background:#0e110e;border:1px solid #555;border-radius:4px}#craftGrid{display:grid;grid-template-columns:repeat(3,48px);gap:4px;justify-content:center;margin:8px}#craftGrid button{height:48px;background:#666;border:2px solid #222;color:#fff;font-size:20px}#craftOut{display:flex;gap:8px;justify-content:center;align-items:center}#hand{display:none!important}';document.head.appendChild(style);const toast=document.createElement('div');toast.id='dropToast';document.body.appendChild(toast);
            let hp=20,food=20;function bars(){const mode=(typeof gameMode!=='undefined'?gameMode:'survival');hud.style.display=mode==='survival'?'block':'none';if($('hpHud'))$('hpHud').textContent='❤'.repeat(Math.ceil(hp/2))+'♡'.repeat(10-Math.ceil(hp/2));if($('foodHud'))$('foodHud').textContent='🍗'.repeat(Math.ceil(food/2))+'▫'.repeat(10-Math.ceil(food/2))}window.mainmetDamagePlayer=(n=1)=>{hp=Math.max(0,hp-n);bars();if(hp===0){hp=20;food=20;if(typeof player!=='undefined'){player.feet.set(.5,heightAt(0,8)+1.02,8.5);player.vel.set(0,0,0)}show('You died — respawned')}};function show(t){toast.textContent=t;toast.style.display='block';clearTimeout(show.t);show.t=setTimeout(()=>toast.style.display='none',1200)}
            const extra=[];const pigTex=tex('#d88f92','#b86f73',211,2048),horseTex=tex('#8a5b3d','#5e3b27',223,2048);function animal(x,z,type){const g=new THREE.Group(),y=heightAt(Math.floor(x),Math.floor(z))+1,tx=type==='pig'?pigTex:horseTex,mat=new THREE.MeshLambertMaterial({map:tx});const body=new THREE.Mesh(new THREE.BoxGeometry(type==='horse'?1:.9,.72,type==='horse'?1.55:1.2),mat);body.position.y=.75;g.add(body);const head=new THREE.Mesh(new THREE.BoxGeometry(.62,.62,.62),mat);head.position.set(0,type==='horse'?1.35:1.08,.78);g.add(head);const lg=type==='horse'?.16:.18,lh=type==='horse'?.8:.55;for(const sx of[-.3,.3])for(const sz of[-.42,.42]){const l=new THREE.Mesh(new THREE.BoxGeometry(lg,lh,lg),mat);l.position.set(sx,lh/2,sz);g.add(l)}g.position.set(x+.5,y,z+.5);scene.add(g);extra.push({g,type,hp:10,phase:Math.random()*6.28,speed:.2+Math.random()*.25,flash:0})}for(let i=0;i<8;i++){const x=(i*11)%48-24,z=(i*17)%48-24;if(Math.hypot(x,z-8)>10)animal(x,z,i%2?'pig':'horse')}
            const drops=[],featureInv={};function drop(pos,name){const o=new THREE.Mesh(new THREE.BoxGeometry(.22,.22,.22),new THREE.MeshLambertMaterial({color:name==='Porkchop'?0xd98989:0x8b4b35}));o.position.copy(pos);o.position.y+=.6;o.userData={name,ttl:45};scene.add(o);drops.push(o);show('دراپ: '+name)}function updateDrops(dt){for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.userData.ttl-=dt;d.rotation.y+=dt*2;if(typeof player!=='undefined'&&d.position.distanceTo(player.feet)<1.5){featureInv[d.userData.name]=(featureInv[d.userData.name]||0)+1;scene.remove(d);drops.splice(i,1);show('+ '+d.userData.name)}else if(d.userData.ttl<=0){scene.remove(d);drops.splice(i,1)}}}
            function flash(m,dt){if(m.flash>0){m.flash-=dt;m.g.traverse(o=>{if(o.material&&o.material.emissive)o.material.emissive.setHex(0x660000)})}else m.g.traverse(o=>{if(o.material&&o.material.emissive)o.material.emissive.setHex(0)})}function updateExtra(dt){for(const m of extra){m.phase+=dt*m.speed;const dx=Math.sin(m.phase)*dt*m.speed,dz=Math.cos(m.phase*.73)*dt*m.speed;m.g.position.x+=dx;m.g.position.z+=dz;m.g.position.y=heightAt(Math.floor(m.g.position.x),Math.floor(m.g.position.z))+1;m.g.rotation.y=Math.atan2(dx,dz);flash(m,dt)}updateDrops(dt);bars()}
            function mobHit(){if(!started||paused)return false;const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(0,0),camera);const objs=[];if(typeof mobs!=='undefined')for(const m of mobs)objs.push(m.g);for(const m of extra)objs.push(m.g);const hits=ray.intersectObjects(objs,true).filter(h=>h.distance<7);if(!hits.length)return false;let o=hits[0].object;while(o.parent&&!extra.some(m=>m.g===o)&&!(typeof mobs!=='undefined'&&mobs.some(m=>m.g===o)))o=o.parent;const em=extra.find(m=>m.g===o);if(em){em.hp-=4;em.flash=.18;if(em.hp<=0){drop(em.g.position,em.type==='pig'?'Porkchop':'Raw Beef');scene.remove(em.g);extra.splice(extra.indexOf(em),1)}show('Animal -4 HP');return true}const om=typeof mobs!=='undefined'?mobs.find(m=>m.g===o):null;if(om){om.hp=(om.hp||10)-4;om.flash=.18;if(om.hp<=0){drop(om.g.position,'Raw Beef');scene.remove(om.g);mobs.splice(mobs.indexOf(om),1)}show('Animal -4 HP');return true}return false}
            renderer.domElement.addEventListener('mousedown',e=>{if(e.button===0&&mobHit())e.stopImmediatePropagation()},true);
            const invPanel=document.querySelector('#inventory .panel');if(invPanel&&!$('craftBox')){const box=document.createElement('div');box.id='craftBox';box.innerHTML='<b>🛠 Crafting Table</b><div id="craftGrid">'+Array.from({length:9},()=>'<button type="button"></button>').join('')+'</div><div id="craftOut"><span id="craftResult">نتیجه: —</span><button class="mcbtn green" id="craftBtn">Craft</button></div>';invPanel.insertBefore(box,$('closeInv'));box.querySelectorAll('#craftGrid button').forEach(b=>b.onclick=()=>{b.textContent=b.textContent?'':'🪵'});$('craftBtn').onclick=()=>{const n=box.querySelectorAll('#craftGrid button'),wood=[...n].filter(b=>b.textContent==='🪵').length;if(wood>=2){featureInv.Planks=(featureInv.Planks||0)+4;$('craftResult').textContent='نتیجه: 4 Planks';show('Craft شد')}else $('craftResult').textContent='حداقل 2 چوب لازم است'}}
            const join=$('armaJoin');if(join)join.onclick=()=>{const u=$('armaUser')?.value.trim()||'ArMaCrafter';const url='https://mcraft.fun/?ip='+encodeURIComponent('ArMaCraftnet.aternos.me:60107')+'&name=ArMaCraft&proxy='+encodeURIComponent('https://mainmet.onrender.com')+'&username='+encodeURIComponent(u);window.open(url,'_blank','noopener');if($('armaStatus'))$('armaStatus').textContent='کلاینت Minecraft Web باز شد؛ حالا Connect را بزن.'};
            $('survivalMode')?.addEventListener('click',()=>{hp=20;food=20;bars()});$('creativeMode')?.addEventListener('click',bars);setInterval(()=>{if(typeof started!=='undefined'&&started&&typeof gameMode!=='undefined'&&gameMode==='survival'){food=Math.max(0,food-.02);bars()}},1000);let last=performance.now();function tick(t){const dt=Math.min(.05,(t-last)/1000);last=t;updateExtra(dt);requestAnimationFrame(tick)}requestAnimationFrame(tick);bars();
          })();
          </script>'''
            s=s.replace('</body>',patch+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('play.html').read_text(encoding='utf-8')
          assert 'MAINMET_FEATURE_UPGRADE_V2' in s
          assert 'mcraft.fun/?ip=' in s
          assert '4096×4096 BLOCK TEXTURES • 2048×2048 MOB TEXTURES' in s
          print('upgrade checks passed')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play.html
          git diff --cached --quiet || (git commit -m 'Upgrade survival animals drops crafting and online join' && git push)
