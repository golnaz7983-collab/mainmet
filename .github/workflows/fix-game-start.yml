# v3
name: Fix game start and texture sizes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair play.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('play.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('1014×1014 MOB TEXTURES','1024×1024 MOB TEXTURES')
          s=s.replace('1014);','1024);')
          # Remove duplicate mob texture declarations: duplicate const declarations stop the whole script from loading.
          lines=s.splitlines()
          out=[]
          seen_cow=False
          seen_sheep=False
          for line in lines:
              if line.strip().startswith('const cowTex='):
                  if seen_cow: continue
                  seen_cow=True
              if line.strip().startswith('const sheepTex='):
                  if seen_sheep: continue
                  seen_sheep=True
              out.append(line)
          s='\n'.join(out)+'\n'
          marker='/* ===== MAINMET_START_FIX ===== */'
          if marker not in s:
              patch=r'''<script>
          /* ===== MAINMET_START_FIX ===== */
          (function(){
            function wire(){
              const start=document.getElementById('startBtn');
              const surv=document.getElementById('survivalMode');
              const creative=document.getElementById('creativeMode');
              if(start && !start.dataset.fixed){
                const old=start.onclick;
                start.onclick=function(e){
                  if(typeof old==='function') old.call(this,e);
                  document.getElementById('start')?.style.setProperty('display','none','important');
                  document.getElementById('tip')?.classList.add('hide');
                };
                start.dataset.fixed='1';
              }
              [surv,creative].forEach(btn=>{
                if(btn && !btn.dataset.fixed){
                  const old=btn.onclick;
                  btn.onclick=function(e){ if(typeof old==='function') old.call(this,e); };
                  btn.dataset.fixed='1';
                }
              });
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',wire,{once:true}); else wire();
            window.addEventListener('message',function(e){
              const d=e.data||{};
              if(d.type==='mainmet-start-game') setTimeout(function(){ document.getElementById('startBtn')?.click(); },0);
            });
          })();
          </script>'''
              s=s.replace('</body>',patch+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('play.html').read_text(encoding='utf-8')
          assert 'const cowTex=' in s and 'const sheepTex=' in s
          assert s.count('const cowTex=') == 1, s.count('const cowTex=')
          assert s.count('const sheepTex=') == 1, s.count('const sheepTex=')
          assert '1024×1024 MOB TEXTURES' in s
          print('play.html checks passed')
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play.html index.html
          git diff --cached --quiet || (git commit -m 'Repair game start and mob texture declarations' && git push)
