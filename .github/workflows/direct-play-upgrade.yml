name: Direct play.html upgrade
on:
  push:
    paths:
      - '.github/workflows/direct-play-upgrade.yml'
  workflow_dispatch:
jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update play.html directly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('play.html')
          s=p.read_text()

          # UI/resolution labels
          s=s.replace('<title>mainmet • Web Game 512</title>','<title>mainmet • Web Game 2048</title>')
          s=s.replace('mainmet • WEB GAME 512','mainmet • WEB GAME 2048')
          s=s.replace('512×512 TEXTURES','2048×2048 BLOCK TEXTURES • 1014×1014 MOB TEXTURES')
          s=s.replace('Web Game 512×512','Web Game 2048×2048')

          # Texture generator: blocks use 2048, mobs can request 1014.
          s=s.replace('function tex(base,accent,seed=1){','function tex(base,accent,seed=1,size=2048){')
          s=s.replace('c.width=c.height=512;','c.width=c.height=size;')
          s=s.replace('x.fillRect(0,0,256,256);','x.fillRect(0,0,c.width,c.height);')
          s=s.replace('for(let i=0;i<5200;i++){','for(let i=0;i<26000;i++){',1)
          s=s.replace('const px=s&255,py=(s>>>8)&255,sz=1+(s%4);','const px=s&(c.width-1),py=(s>>>8)&(c.height-1),sz=1+(s%8);',1)
          s=s.replace('for(let i=0;i<800;i++){','for(let i=0;i<4000;i++){',1)
          s=s.replace('const px=s&255,py=(s>>>8)&255;','const px=s&(c.width-1),py=(s>>>8)&(c.height-1);',1)

          # More GPU capacity for streamed chunks.
          s=s.replace('const MAX_INSTANCES=12000;','const MAX_INSTANCES=70000;')

          # Replace fixed world with deterministic streaming chunks.
          start=s.find('for(let x=-30;x<=30;x++)for(let z=-30;z<=30;z++){')
          end=s.find('/* ---------- roaming mobs ---------- */')
          if start!=-1 and end!=-1:
            world=r'''const CHUNK_SIZE=16,STREAM_RADIUS=2;
const worldChunks=new Map();
const editedBlocks=new Map();
function chunkId(cx,cz){return `${cx},${cz}`}
function chunkFor(x,z){return [Math.floor(x/CHUNK_SIZE),Math.floor(z/CHUNK_SIZE)]}
function rememberEdit(x,y,z,type){editedBlocks.set(key(x,y,z),type||null)}
function generateChunk(cx,cz){
 const id=chunkId(cx,cz); if(worldChunks.has(id)) return;
 const list=[]; worldChunks.set(id,list);
 const put=(x,y,z,t)=>{addBlock(x,y,z,t);list.push(key(x,y,z));};
 for(let lx=0;lx<CHUNK_SIZE;lx++)for(let lz=0;lz<CHUNK_SIZE;lz++){
  const x=cx*CHUNK_SIZE+lx,z=cz*CHUNK_SIZE+lz,h=Math.max(2,heightAt(x,z));
  heights.set(key(x,0,z),h);
  for(let y=0;y<=h;y++){const ek=key(x,y,z);const et=editedBlocks.get(ek);if(et===null)continue;put(x,y,z,et|| (y===h?'grass':y>=h-2?'dirt':'stone'));}
 }
 for(let lx=2;lx<CHUNK_SIZE-2;lx+=5)for(let lz=2;lz<CHUNK_SIZE-2;lz+=5){
  const x=cx*CHUNK_SIZE+lx,z=cz*CHUNK_SIZE+lz;
  if(Math.hypot(x,z-8)<11||rnd(x+4,z+8)>.72)continue;
  const h=heightAt(x,z)+1;
  for(let i=0;i<4;i++)put(x,h+i,z,'wood');
  for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=1;dy<=3;dy++)if(Math.abs(dx)+Math.abs(dz)<4)put(x+dx,h+dy,z+dz,'leaves');
 }
}
function unloadChunk(cx,cz){
 const id=chunkId(cx,cz),list=worldChunks.get(id);if(!list)return;
 for(const k of list){const b=blocks.get(k);if(b)removeBlock(b.x,b.y,b.z)}
 worldChunks.delete(id);
}
function updateWorldStreaming(){
 const [pcx,pcz]=chunkFor(player.feet.x,player.feet.z),wanted=new Set();
 for(let dx=-STREAM_RADIUS;dx<=STREAM_RADIUS;dx++)for(let dz=-STREAM_RADIUS;dz<=STREAM_RADIUS;dz++){const cx=pcx+dx,cz=pcz+dz;wanted.add(chunkId(cx,cz));generateChunk(cx,cz);}
 for(const id of [...worldChunks.keys()])if(!wanted.has(id)){const [cx,cz]=id.split(',').map(Number);unloadChunk(cx,cz)}
}
for(let cx=-2;cx<=2;cx++)for(let cz=-2;cz<=2;cz++)generateChunk(cx,cz);
'''
            s=s[:start]+world+s[end:]

          # Mob textures at exactly 1014x1014.
          s=s.replace('const sandTex=tex("#cfb66d","#bca15b",73);','const sandTex=tex("#cfb66d","#bca15b",73);\nconst cowTex=tex("#6b472c","#3e2818",91,1014);\nconst sheepTex=tex("#e8e7df","#b9b9b3",103,1014);')
          s=s.replace("const bm=new THREE.MeshLambertMaterial({color:type==='sheep'?0xe8e7df:0x6b472c}),hm=new THREE.MeshLambertMaterial({color:type==='sheep'?0xd9d9d4:0x56371f});","const animalTex=type==='sheep'?sheepTex:cowTex;const bm=new THREE.MeshLambertMaterial({map:animalTex});const hm=new THREE.MeshLambertMaterial({map:animalTex});")

          # Survival / Creative selection UI.
          marker='<button class="mcbtn green" id="startBtn">🎮 شروع بازی</button>'
          modes='<div class="modeSelect"><button class="modeBtn sel" id="survivalMode">🛡️ Survival</button><button class="modeBtn" id="creativeMode">🧱 Creative</button></div>\n '+marker
          s=s.replace(marker,modes)
          css='''\n.modeSelect{display:flex;gap:8px;margin:10px 0}.modeBtn{flex:1;padding:12px;border:2px solid #555;background:#292929;color:#fff;font-weight:900;border-radius:4px;cursor:pointer}.modeBtn.sel{border-color:#7bc37e;background:#315c36}\n#controlSettings{position:fixed;z-index:95;left:10px;top:90px;width:44px;height:38px;border:2px solid #555;border-radius:4px;background:#111c;color:#fff;font-weight:900}\n#controlsModal{position:fixed;inset:0;z-index:125;background:#000c;display:none;align-items:center;justify-content:center;padding:18px}#controlsModal.show{display:flex}.controlsBox{width:min(560px,94vw);max-height:90vh;overflow:auto;background:#151815;border:3px solid #555;box-shadow:0 24px 90px #000;color:#fff;padding:18px}.controlGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.controlRow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#0e110e;border:1px solid #454b45;padding:8px;border-radius:4px}.controlRow input{width:100px;background:#090b09;color:#fff;border:1px solid #666;padding:7px;direction:ltr}\n@media(orientation:landscape) and (pointer:coarse){#joy{left:24px;bottom:26px}.break{right:98px;bottom:28px}.place{right:24px;bottom:28px}.look{right:24px;top:26px}.touchbtn{width:58px;height:58px}}\n'''
          s=s.replace('</style>',css+'</style>',1)
          s=s.replace('<button id="pauseBtn">Ⅱ</button>','<button id="pauseBtn">Ⅱ</button><button id="controlSettings" title="تنظیم دکمه‌ها">⚙</button>')
          controls='''<div id="controlsModal"><div class="controlsBox"><h2>⚙ تنظیم دکمه‌ها</h2><p>تنظیمات کامپیوتر و موبایل در همین مرورگر ذخیره می‌شود.</p><div class="controlGrid"><label class="controlRow"><span>جلو</span><input id="bindForward" value="Z" maxlength="12"></label><label class="controlRow"><span>چپ</span><input id="bindLeft" value="Q" maxlength="12"></label><label class="controlRow"><span>عقب</span><input id="bindBack" value="S" maxlength="12"></label><label class="controlRow"><span>راست</span><input id="bindRight" value="D" maxlength="12"></label><label class="controlRow"><span>پرش</span><input id="bindJump" value="Space" maxlength="12"></label><label class="controlRow"><span>Inventory</span><input id="bindInv" value="E" maxlength="12"></label></div><button class="mcbtn green" id="saveControls">ذخیره</button><button class="mcbtn" id="resetControls">پیش‌فرض</button><button class="mcbtn" id="closeControls">بستن</button></div></div>\n'''
          if 'id="controlsModal"' not in s:s=s.replace('<div id="rotate">',controls+'<div id="rotate">')

          # Game mode state and creative movement.
          s=s.replace('let yaw=0,pitch=0,selected=0,started=false,paused=false;','let yaw=0,pitch=0,selected=0,started=false,paused=false,lastChunkX=999999,lastChunkZ=999999;let gameMode=localStorage.getItem("mainmet.gamemode")||"survival";')
          old='if((keys.Space||keys.KeyJ)&&player.onGround){player.vel.y=7;player.onGround=false}\n player.vel.y-=19*dt;player.onGround=false;'
          new='if(gameMode==="creative"){player.vel.y=0;if(keys.Space)player.feet.y+=8*dt;if(keys.ShiftLeft||keys.ShiftRight)player.feet.y-=8*dt;player.onGround=false}else{if((keys.Space||keys.KeyJ)&&player.onGround){player.vel.y=7;player.onGround=false}player.vel.y-=19*dt;player.onGround=false;}'
          s=s.replace(old,new)

          # Persist block edits so leaving/re-entering chunks keeps changes.
          s=s.replace('function breakBlock(){const h=hit();if(!h)return;const p=h.object.userData;removeBlock(p.x,p.y,p.z);swing()}','function breakBlock(){const h=hit();if(!h)return;const p=h.object.userData;removeBlock(p.x,p.y,p.z);rememberEdit(p.x,p.y,p.z,null);swing()}')
          s=s.replace('addBlock(x,y,z,["grass","dirt","stone","wood","leaves","sand"][selected]);swing();','const bt=["grass","dirt","stone","wood","leaves","sand"][selected];addBlock(x,y,z,bt);rememberEdit(x,y,z,bt);swing();')

          # Update chunks while travelling.
          s=s.replace('if(started&&!paused){physics(dt);updateMobs(dt);}','if(started&&!paused){physics(dt);updateMobs(dt);const cf=chunkFor(player.feet.x,player.feet.z);if(cf[0]!==lastChunkX||cf[1]!==lastChunkZ){lastChunkX=cf[0];lastChunkZ=cf[1];updateWorldStreaming();}}')

          # Mode button handlers before start handler.
          oldstart='document.getElementById("startBtn").onclick=()=>{'
          modejs='''document.getElementById("survivalMode").onclick=()=>{gameMode="survival";localStorage.setItem("mainmet.gamemode",gameMode);document.getElementById("survivalMode").classList.add("sel");document.getElementById("creativeMode").classList.remove("sel")};document.getElementById("creativeMode").onclick=()=>{gameMode="creative";localStorage.setItem("mainmet.gamemode",gameMode);document.getElementById("creativeMode").classList.add("sel");document.getElementById("survivalMode").classList.remove("sel")};if(gameMode==="creative"){document.getElementById("creativeMode").classList.add("sel");document.getElementById("survivalMode").classList.remove("sel")};\n'''+oldstart
          s=s.replace(oldstart,modejs,1)

          # Controls settings script.
          script='''<script>\n(function(){const m=document.getElementById("controlsModal");if(!m)return;const ids=["bindForward","bindLeft","bindBack","bindRight","bindJump","bindInv"];const d={bindForward:"Z",bindLeft:"Q",bindBack:"S",bindRight:"D",bindJump:"Space",bindInv:"E"};function load(){ids.forEach(id=>document.getElementById(id).value=localStorage.getItem("mainmet.bind."+id)||d[id])}load();document.getElementById("controlSettings").onclick=()=>{load();m.classList.add("show")};document.getElementById("closeControls").onclick=()=>m.classList.remove("show");document.getElementById("resetControls").onclick=()=>{ids.forEach(id=>localStorage.removeItem("mainmet.bind."+id));load()};document.getElementById("saveControls").onclick=()=>{ids.forEach(id=>localStorage.setItem("mainmet.bind."+id,document.getElementById(id).value.trim()||d[id]));m.classList.remove("show")}})();\n</script>\n'''
          if 'mainmet.bind.bindForward' not in s:s=s.replace('<script>\n/* ===== mainmet ArMaCraft account/skin helper ===== */',script+'<script>\n/* ===== mainmet ArMaCraft account/skin helper ===== */',1)

          p.write_text(s)
          PY
      - name: Commit play.html
        run: |
          git config user.name 'mainmet-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play.html
          git diff --cached --quiet || git commit -m 'Directly upgrade play.html world, modes and textures'
          git push
