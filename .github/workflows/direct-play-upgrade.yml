name: Direct play.html upgrade
on:
  push:
    paths:
      - '.github/workflows/direct-play-upgrade.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch play.html
        run: python3 scripts/direct_upgrade.py
      - name: Commit play.html
        run: |
          git config user.name 'mainmet-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play.html
          git diff --cached --quiet || git commit -m 'Directly upgrade play.html world, modes and textures'
          git push
