name: mainmet 256 update

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upgrade play.html
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("play.html")
          s = p.read_text(encoding="utf-8")

          # 256x256 dense pixel texture generator.
          tex = '''function tex(base,accent,seed=1){
           const c=document.createElement("canvas");c.width=c.height=256;
           const x=c.getContext("2d",{alpha:false});
           x.imageSmoothingEnabled=false;
           x.fillStyle=base;x.fillRect(0,0,256,256);
           let s=seed>>>0;
           for(let i=0;i<2600;i++){
            s=(s*1664525+1013904223)>>>0;
            const px=s&255,py=(s>>>8)&255,sz=1+(s%4);
            x.globalAlpha=.18+(s%5)*.08;
            x.fillStyle=(s&1)?accent:base;
            x.fillRect(px,py,sz,sz);
           }
           x.globalAlpha=1;
           for(let i=0;i<420;i++){
            s=(s*1664525+1013904223)>>>0;
            const px=s&255,py=(s>>>8)&255;
            x.fillStyle=(s&2)?"#ffffff":"#000000";
            x.globalAlpha=.045+(s%4)*.02;
            x.fillRect(px,py,1+(s%2),1+(s%2));
           }
           x.globalAlpha=1;
           const t=new THREE.CanvasTexture(c);
           t.colorSpace=THREE.SRGBColorSpace;
           t.magFilter=THREE.NearestFilter;
           t.minFilter=THREE.NearestMipmapNearestFilter;
           t.generateMipmaps=true;
           return t;
          }'''
          s,n = re.subn(r'function tex\(base,accent,seed=1\)\{.*?\n\}', tex, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("texture function not found")

          # Fix mob helper typos in the supplied version.
          s=s.replace("hAt(","heightAt(").replace("rand(","rnd(")

          # ZQSD movement; W remains the pause-menu return key.
          s=s.replace('let f=(keys.KeyW?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0);',
                      'let f=(keys.KeyZ?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyQ?1:0);')
          s=s.replace("WASD حرکت","ZQSD حرکت").replace("W A S D","Z Q S D").replace("PC: WASD","PC: ZQSD")
          s=s.replace("keys.KeyW=dy<-12;keys.KeyS=dy>12;keys.KeyA=dx<-12;keys.KeyD=dx>12;",
                      "keys.KeyZ=dy<-12;keys.KeyS=dy>12;keys.KeyQ=dx<-12;keys.KeyD=dx>12;")
          s=s.replace("keys.KeyW=keys.KeyS=keys.KeyA=keys.KeyD=false",
                      "keys.KeyZ=keys.KeyS=keys.KeyQ=keys.KeyD=false")

          # Minecraft-inspired UI.
          s=s.replace('#game{position:fixed;inset:0}', '''#game{position:fixed;inset:0;z-index:0}
          .panel{background:linear-gradient(135deg,#2b2b2b,#191919);border:3px solid #111;
          box-shadow:inset 3px 3px #777,inset -3px -3px #080808,0 18px 70px #000;
          image-rendering:pixelated}
          .mcbtn{border:3px solid #151515;border-radius:2px;
          box-shadow:inset 2px 2px #aaa,inset -3px -3px #222,0 2px 0 #000}
          .mcbtn:hover{filter:brightness(1.15)}
          .mcbtn:active{transform:translateY(2px)}
          .slot,.invslot{border-radius:1px;image-rendering:pixelated}''',1)

          s=s.replace('scene.background=new THREE.Color(0x79c7ef);','scene.background=new THREE.Color(0x82c9f2);')
          s=s.replace('scene.fog=new THREE.Fog(0x79c7ef,45,135);','scene.fog=new THREE.Fog(0x82c9f2,55,160);')
          s=s.replace('renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));','renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2.5));')

          # Replace the flat 2D hand with a blocky 3D first-person arm.
          s=s.replace('<div id="hand"><div class="sleeve"></div><div class="skin"></div></div>','')
          hand='''// ---------- first-person blocky arm ----------
          const handRoot=new THREE.Group();
          const sleeveMat=new THREE.MeshLambertMaterial({color:0x2f79a8});
          const skinMat=new THREE.MeshLambertMaterial({color:0xc98e6a});
          const darkSkinMat=new THREE.MeshLambertMaterial({color:0xb87859});
          const armMesh=new THREE.Mesh(new THREE.BoxGeometry(.34,.88,.34),sleeveMat);
          armMesh.position.set(.22,-.22,-.62);
          const palmMesh=new THREE.Mesh(new THREE.BoxGeometry(.44,.46,.32),skinMat);
          palmMesh.position.set(.22,-.70,-.72);
          handRoot.add(armMesh,palmMesh);
          for(let i=0;i<4;i++){
            const f=new THREE.Mesh(new THREE.BoxGeometry(.09,.27,.10),darkSkinMat);
            f.position.set(.08+i*.10,-.94,-.79);
            handRoot.add(f);
          }
          const thumb=new THREE.Mesh(new THREE.BoxGeometry(.11,.28,.11),darkSkinMat);
          thumb.position.set(.00,-.73,-.73);thumb.rotation.z=-.45;handRoot.add(thumb);
          camera.add(handRoot);'''
          s=s.replace('camera.position.set(0,5,8);','camera.position.set(0,5,8);\n'+hand,1)
          s=s.replace('function swing(){document.getElementById("hand").animate([{transform:"rotate(-7deg) translateY(0)"},{transform:"rotate(-16deg) translateY(15px)"},{transform:"rotate(-7deg) translateY(0)"}],{duration:140})}',
                      '''function swing(){
            handRoot.position.y=-.10;handRoot.rotation.x=-.16;
            setTimeout(()=>{handRoot.position.y=0;handRoot.rotation.x=0},110);
          }''')

          s=s.replace('WEB GAME HD','WEB GAME 256').replace('HD RENDER','256×256 TEXTURES')
          s=s.replace('Web Game HD —','Web Game 256×256 —')
          p.write_text(s,encoding="utf-8")

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play.html
          git rm .github/workflows/mainmet-256-update.yml
          git commit -m "Upgrade mainmet to Minecraft-style 256x256 textures"
          git push
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" || true
