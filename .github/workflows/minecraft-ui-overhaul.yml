name: Minecraft-style UI overhaul
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/minecraft-ui-overhaul.yml'
permissions:
  contents: write
jobs:
  overhaul:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update launcher and inventory UI
        shell: python
        run: |
          from pathlib import Path
          p=Path('play.html')
          s=p.read_text(encoding='utf-8')
          old=s
          css=r'''<style id="MAINMET_MINECRAFT_UI_CSS">
          #mmWorldCreate{position:fixed;inset:0;z-index:160;display:none;align-items:center;justify-content:center;background:#000b;padding:18px;color:#fff}
          #mmWorldCreate.show{display:flex}.mmCreateBox{width:min(720px,94vw);background:#171817;border:3px solid #555;box-shadow:0 24px 90px #000;padding:22px;text-align:center}.mmCreateBox h2{margin:0 0 6px;font-size:30px;text-shadow:3px 3px #000}.mmCreateBox p{color:#ccc;margin:6px 0 15px}.mmWorldName{width:100%;background:#090b09;color:#fff;border:2px solid #666;padding:12px;font-size:16px;text-align:center}.mmModes{display:flex;gap:10px;margin:14px 0}.mmMode{flex:1;padding:14px;background:#3b3b3b;color:#fff;border:3px solid #222;font-weight:900;cursor:pointer}.mmMode.sel{background:#315c36;border-color:#8bd18d}.mmCreate{width:100%;padding:14px;background:linear-gradient(#78aa55,#466d32);color:#fff;border:3px solid #222;font-weight:900;font-size:16px;cursor:pointer}
          #mmInv{position:fixed;inset:0;z-index:155;display:none;align-items:center;justify-content:center;background:#000b;padding:14px;color:#fff}.mmInvBox{width:min(1050px,96vw);max-height:94vh;overflow:auto;background:#777;border:4px solid #222;box-shadow:inset 3px 3px #bbb,inset -4px -4px #333,0 20px 80px #000;padding:14px;direction:ltr}.mmInvTop{display:grid;grid-template-columns:1fr 210px;gap:18px}.mmSlots{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}.mmSlot{height:54px;background:#666;border:3px solid #333;box-shadow:inset 2px 2px #aaa,inset -3px -3px #333;position:relative;cursor:pointer}.mmSlot span{position:absolute;left:4px;top:2px;font-size:11px;text-shadow:2px 2px #000}.mmCraft{background:#666;border:3px solid #333;padding:10px}.mmCraftGrid{display:grid;grid-template-columns:repeat(2,48px);gap:5px;margin:8px auto;width:max-content}.mmCraftGrid div{width:48px;height:48px;background:#777;border:3px solid #333;box-shadow:inset 2px 2px #aaa,inset -3px -3px #333}.mmResult{width:54px;height:54px;background:#777;border:3px solid #333;margin:10px auto}.mmInvTitle{font-weight:900;margin:8px 0;color:#fff;text-shadow:2px 2px #222}.mmCatalog{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:8px}.mmItem{min-height:38px;background:#555;border:2px solid #333;color:#fff;font-size:9px;padding:4px;cursor:pointer;text-align:center}.mmItem:hover{filter:brightness(1.25)}.mmClose{width:100%;margin-top:10px;padding:10px;background:#444;color:#fff;border:2px solid #222;font-weight:900}
          @media(max-width:700px){.mmCatalog{grid-template-columns:repeat(6,1fr)}.mmSlot{height:44px}.mmInvTop{grid-template-columns:1fr}}
          </style>'''
          if 'MAINMET_MINECRAFT_UI_CSS' not in s:s=s.replace('</head>',css+'</head>',1)
          html=r'''<div id="mmWorldCreate"><div class="mmCreateBox"><h2>mainmet</h2><p>ساخت دنیای جدید</p><input id="mmWorldName" class="mmWorldName" value="World" maxlength="24" placeholder="نام دنیا"><div class="mmModes"><button class="mmMode sel" data-mode="survival">🛡️ Survival</button><button class="mmMode" data-mode="creative">🧱 Creative</button></div><button id="mmCreateWorld" class="mmCreate">▶ ساخت دنیا و ورود</button></div></div><div id="mmInv"><div class="mmInvBox"><div class="mmInvTop"><div><div class="mmInvTitle">کوله‌پشتی — 36 خانه</div><div id="mmInvGrid" class="mmSlots"></div></div><div class="mmCraft"><div class="mmInvTitle">ساخت اولیه — 2×2</div><div class="mmCraftGrid"><div></div><div></div><div></div><div></div></div><div class="mmResult"></div><div style="font-size:10px;color:#eee;text-align:center">وسایل اولیه را اینجا ترکیب کن</div></div></div><div class="mmInvTitle">همه آیتم‌ها و بلوک‌ها</div><div id="mmCatalog" class="mmCatalog"></div><button id="mmInvClose" class="mmClose">بستن کوله</button></div></div>'''
          if 'id="mmWorldCreate"' not in s:s=s.replace('<body>','<body>'+html,1)
          js=r'''<script id="MAINMET_MINECRAFT_UI_JS">(()=>{const modes=[...document.querySelectorAll('.mmMode')];let mode='survival';modes.forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;modes.forEach(x=>x.classList.toggle('sel',x===b));localStorage.setItem('mainmet.gamemode',mode)}));const world=document.getElementById('mmWorldCreate'),inv=document.getElementById('mmInv'),start=document.getElementById('startBtn')||document.querySelector('#start .mcbtn.green');let worldShown=false;function showWorld(){worldShown=true;world.classList.add('show');const saved=localStorage.getItem('mainmet.gamemode');if(saved){mode=saved;modes.forEach(x=>x.classList.toggle('sel',x.dataset.mode===mode))}}if(start)start.addEventListener('click',e=>{if(!worldShown){e.preventDefault();e.stopImmediatePropagation();showWorld()}},true);document.getElementById('mmCreateWorld').onclick=async()=>{localStorage.setItem('mainmet.gamemode',mode);localStorage.setItem('mainmet.worldName',document.getElementById('mmWorldName').value.trim()||'World');world.classList.remove('show');worldShown=false;try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch(_){}const original=document.getElementById('startBtn')||document.querySelector('#start .mcbtn.green');if(original)original.click();const st=document.getElementById('start');if(st)st.style.display='none';window.started=true};const items=`Stone,Cobblestone,Dirt,Grass Block,Sand,Gravel,Clay,Oak Log,Oak Planks,Oak Leaves,Birch Log,Birch Planks,Birch Leaves,Spruce Log,Spruce Planks,Spruce Leaves,Jungle Log,Jungle Planks,Jungle Leaves,Acacia Log,Acacia Planks,Acacia Leaves,Dark Oak Log,Dark Oak Planks,Dark Oak Leaves,Glass,Glass Pane,Bricks,Bookshelf,Crafting Table,Furnace,Chest,Barrel,Torch,Lantern,Water,Lava,Snow,Ice,Obsidian,Iron Ore,Coal Ore,Gold Ore,Diamond Ore,Emerald Ore,Redstone Ore,Copper Ore,Deepslate,Andesite,Diorite,Granite,Quartz Block,Glowstone,End Stone,Nether Brick,Netherrack,Soul Sand,Soul Soil,Hay Bale,Wheat,Carrot,Potato,Beetroot,Apple,Bread,Cookie,Cake,Melon Slice,Pumpkin,Raw Beef,Cooked Beef,Raw Porkchop,Cooked Porkchop,Raw Chicken,Cooked Chicken,Raw Mutton,Cooked Mutton,Raw Cod,Cooked Cod,Raw Salmon,Cooked Salmon,Leather,Feather,Bone,String,Spider Eye,Rotten Flesh,Arrow,Stick,Paper,Book,Compass,Clock,Bucket,Water Bucket,Lava Bucket,Flint,Flint and Steel,Shears,Fishing Rod,Bow,Crossbow,Shield,Sword,Pickaxe,Axe,Shovel,Hoe,Iron Ingot,Gold Ingot,Diamond,Emerald,Coal,Redstone,Quartz,Nether Star,Blaze Rod,Ender Pearl,Eye of Ender,Lead,Saddle,Name Tag,Leather Helmet,Leather Chestplate,Leather Leggings,Leather Boots,Iron Helmet,Iron Chestplate,Iron Leggings,Iron Boots,Diamond Helmet,Diamond Chestplate,Diamond Leggings,Diamond Boots,Netherite Helmet,Netherite Chestplate,Netherite Leggings,Netherite Boots,White Wool,Orange Wool,Magenta Wool,Light Blue Wool,Yellow Wool,Lime Wool,Pink Wool,Gray Wool,Light Gray Wool,Cyan Wool,Purple Wool,Blue Wool,Brown Wool,Green Wool,Red Wool,Black Wool,White Concrete,Orange Concrete,Magenta Concrete,Light Blue Concrete,Yellow Concrete,Lime Concrete,Pink Concrete,Gray Concrete,Light Gray Concrete,Cyan Concrete,Purple Concrete,Blue Concrete,Brown Concrete,Green Concrete,Red Concrete,Black Concrete,Oak Door,Oak Trapdoor,Oak Fence,Oak Fence Gate,Stone Button,Stone Pressure Plate,Lever,Redstone Torch,Repeater,Comparator,Piston,Sticky Piston,Dispenser,Dropper,Hopper,Note Block,Observer,Daylight Sensor,TNT,Enchanting Table,Anvil,Grindstone,Loom,Stonecutter,Smoker,Blast Furnace,Cartography Table,Fletching Table,Smithing Table,Flower Pot,Painting,Item Frame,Armor Stand`.split(',');const grid=document.getElementById('mmInvGrid'),cat=document.getElementById('mmCatalog');for(let i=0;i<36;i++){const d=document.createElement('div');d.className='mmSlot';d.innerHTML='<span>'+(i+1)+'</span>';grid.appendChild(d)}items.forEach(name=>{const d=document.createElement('button');d.className='mmItem';d.textContent=name;d.title=name;d.onclick=()=>{const empty=[...grid.children].find(x=>!x.dataset.item);if(empty){empty.dataset.item=name;empty.querySelector('span').textContent=name.slice(0,10)}};cat.appendChild(d)});document.getElementById('mmInvClose').onclick=()=>inv.style.display='none';document.addEventListener('keydown',e=>{if(String(e.key).toLowerCase()==='e'&&!e.ctrlKey&&!e.altKey){const a=document.activeElement;if(a&&['INPUT','TEXTAREA'].includes(a.tagName))return;inv.style.display=inv.style.display==='flex'?'none':'flex'}});window.mainmetOpenInventory=()=>inv.style.display='flex';window.mainmetSelectedMode=()=>mode})();</script>'''
          if 'MAINMET_MINECRAFT_UI_JS' not in s:s=s.replace('</body>',js+'</body>',1)
          if s!=old:p.write_text(s,encoding='utf-8')
      - name: Validate and commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('play.html').read_text(encoding='utf-8')
          for x in ['MAINMET_MINECRAFT_UI_CSS','MAINMET_MINECRAFT_UI_JS','mmWorldCreate','mmInvGrid','mmCatalog']:
            assert x in s, x
          assert s.count('MAINMET_MINECRAFT_UI_JS')==1
          print('UI overhaul validated')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play.html .github/workflows/minecraft-ui-overhaul.yml
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Overhaul launcher menu inventory and world creation'
          git push
