name: Inject Diccorf HTTP fallback
on:
  push:
    paths:
      - 'diccorf/http-fallback.js'
      - 'diccorf/index.html'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject fallback script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('diccorf/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="http-fallback.js?v=1"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diccorf/index.html
          git diff --cached --quiet || git commit -m 'Enable Diccorf HTTP message fallback'
          git push
