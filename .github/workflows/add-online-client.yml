name: Add ArMaCraft online client

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch play.html
        run: python scripts/add_online_client.py
      - name: Commit online launcher
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play.html scripts/add_online_client.py .github/workflows/add-online-client.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Add ArMaCraft real browser online launcher'
          git push
