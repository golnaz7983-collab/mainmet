name: Smooth mainmet terrain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smooth-terrain.yml'

permissions:
  contents: write

jobs:
  smooth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smooth terrain and tree spacing
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('play.html');s=p.read_text(encoding='utf-8')
          smooth='''function heightAt(x,z){
           const a=Math.sin(x*.13)*.90+Math.cos(z*.11)*.82;
           const b=Math.sin((x+z)*.07)*.65+Math.cos((x-z)*.055)*.55;
           const c=Math.sin(x*.035+z*.045)*.45;
           return Math.max(2,Math.min(8,Math.round(4.1+a*.55+b*.55+c)));
          }'''
          s=re.sub(r'function heightAt\(x,z\)\{.*?\n\}',smooth,s,count=1,flags=re.S)
          s=s.replace('if(Math.abs(dx)+Math.abs(dz)<4)addBlock(x+dx,h+dy,z+dz,"leaves");','if(Math.abs(dx)+Math.abs(dz)<4)addBlock(x+dx,h+dy,z+dz,"leaves");')
          s=s.replace('l.castShadow=true;g.add(l)','l.castShadow=false;g.add(l)')
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play.html
          git diff --cached --quiet && exit 0
          git commit -m 'Smooth terrain and tree rendering'
          git push
