name: Emergency Minecraft Repair
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/emergency-minecraft-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean and repair play.html
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('play.html'); s=p.read_text(encoding='utf-8'); old=s
          # Stable non-module Three.js loading.
          s=s.replace('<script type="module">\nimport * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js";','<script>')
          if 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js' not in s:
              s=s.replace('<head>','<head><script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>',1)
          # Remove every duplicated configurable-control block and install exactly one.
          pat=re.compile(r'<script>\s*\(function\(\)\{\s*const defaults=\{forward:\'KeyZ\',left:\'KeyQ\',back:\'KeyS\',right:\'KeyD\',jump:\'Space\',inv:\'KeyE\'\};.*?\}\)\(\);\s*</script>',re.S)
          s=pat.sub('',s)
          controls='''<script id="MAINMET_CONTROLS_CLEAN">(()=>{const d={forward:'KeyZ',left:'KeyQ',back:'KeyS',right:'KeyD',jump:'Space',inv:'KeyE'};window.mainmetKeyFor=n=>localStorage.getItem('mainmet.key.'+n)||d[n];window.mainmetKeys=window.mainmetKeys||{};window.mainmetKeyDown=n=>!!window.mainmetKeys[window.mainmetKeyFor(n)];addEventListener('keydown',e=>window.mainmetKeys[e.code]=true);addEventListener('keyup',e=>window.mainmetKeys[e.code]=false);})();</script>'''
          s=s.replace('</body>',controls+'</body>',1)
          # Remove broken/old final start wrappers, then install one capture-phase start handler.
          s=re.sub(r'<script id="MAINMET_START_FINAL">.*?</script>','',s,flags=re.S)
          s=re.sub(r'<script id="MAINMET_EMERGENCY_START">.*?</script>','',s,flags=re.S)
          start='''<script id="MAINMET_START_FINAL">(()=>{const boot=()=>{const b=document.getElementById('startBtn'),st=document.getElementById('start');if(!b||b.dataset.final)return;b.dataset.final='1';b.addEventListener('click',()=>{try{window.started=true}catch(_){}if(st)st.style.setProperty('display','none','important');document.getElementById('tip')?.classList.add('hide');try{document.querySelector('#game canvas')?.requestPointerLock?.()}catch(_){}},true);for(const id of ['survivalMode','creativeMode'])document.getElementById(id)?.addEventListener('click',()=>localStorage.setItem('mainmet.gamemode',id==='creativeMode'?'creative':'survival'),true)};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot()})();</script>'''
          s=s.replace('</body>',start+'</body>',1)
          # Keep Minecraft-style HD wording, not a claim of bundled official assets.
          s=s.replace('4096×4096 BLOCK TEXTURES • 2048×2048 MOB TEXTURES','MINECRAFT-STYLE HD TEXTURES • HD 3D MOBS')
          # Deduplicate mob texture declarations.
          for name in ('cowTex','sheepTex'):
              mp=re.compile(r'const '+name+r'=tex\([^;]+;')
              ms=list(mp.finditer(s))
              if len(ms)>1:
                  keep=ms[0].group(0); s=mp.sub('',s); pos=s.find('const dirtTex='); s=s[:pos]+keep+'\n'+s[pos:] if pos>=0 else keep+s
          # Moderate quality/FPS balance.
          s=s.replace('renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));','renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));')
          if s!=old:p.write_text(s,encoding='utf-8')
      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('play.html').read_text(encoding='utf-8')
          assert s.count('id="startBtn"')==1
          assert s.count('const cowTex=')<=1
          assert s.count('const sheepTex=')<=1
          assert 'MAINMET_START_FINAL' in s
          assert 'window.mainmetKeyDown' in s
          print('OK')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play.html .github/workflows/emergency-minecraft-repair.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix startup and remove duplicate control scripts'
          git push