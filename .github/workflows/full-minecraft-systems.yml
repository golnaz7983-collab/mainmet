name: Full Minecraft Systems
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/full-minecraft-systems.yml'
permissions:
  contents: write
jobs:
  systems:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add survival animals night and drops
        shell: python
        run: |
          from pathlib import Path
          p=Path('play.html')
          s=p.read_text(encoding='utf-8')
          if 'MAINMET_FULL_MOBS_V1' in s:
              print('Systems already present')
              raise SystemExit
          css='''<style id="MAINMET_FULL_MOBS_CSS">\n.mmMobName{position:absolute;transform:translate(-50%,-100%);font:700 10px Tahoma;color:#fff;text-shadow:2px 2px #000;pointer-events:none;z-index:28}.mmDrop{position:absolute;z-index:29;background:#111d;color:#fff;border:1px solid #777;padding:3px 5px;border-radius:3px;font-size:10px;pointer-events:none}.mmHealth{position:fixed;left:50%;top:calc(50% + 28px);transform:translateX(-50%);z-index:27;color:#fff;text-shadow:2px 2px #000;font:bold 12px Tahoma}.mmNight{position:fixed;right:10px;top:92px;z-index:26;background:#111c;border:2px solid #555;color:#fff;padding:6px 9px;font:700 11px Tahoma;direction:ltr}</style>'''
          s=s.replace('</head>',css+'</head>',1)
          js=r'''<script id="MAINMET_FULL_MOBS_V1">
          (()=>{
            const THREE=window.THREE;if(!THREE||!window.scene||!window.camera)return;
            const root=new THREE.Group();root.name='mainmet-minecraft-animals';scene.add(root);
            const animals=['Cow','Pig','Sheep','Chicken','Horse','Donkey','Mule','Rabbit','Wolf','Cat','Fox','Goat','Llama','Polar Bear','Panda','Bee','Dolphin','Turtle','Frog','Axolotl'];
            const colors={Cow:0x6b4a32,Pig:0xe49aa0,Sheep:0xe8e5dc,Chicken:0xf0eee5,Horse:0x7b5235,Donkey:0x8b765e,Mule:0x6d5c49,Rabbit:0xb78b6a,Wolf:0xaaa7a0,Cat:0x77726b,Fox:0xc66a32,Goat:0x8a8a82,Llama:0xb6a487,'Polar Bear':0xe8e8e8,Panda:0x202020,Bee:0xf0c331,Dolphin:0x688aa1,Turtle:0x477b45,Frog:0x57933e,Axolotl:0xe99bb0};
            const live=[];
            function mat(c){return new THREE.MeshLambertMaterial({color:c});}
            function mob(type,x,z){
              const g=new THREE.Group();g.userData={type,health:10,drop:type==='Cow'?'Leather + Beef':type==='Sheep'?'Wool + Mutton':type==='Pig'?'Porkchop':type==='Chicken'?'Feather + Chicken':type==='Bee'?'Honeycomb':'Drop'};
              const m=mat(colors[type]??0x999999), dark=mat(0x292929), white=mat(0xf4f4f4);
              const body=new THREE.Mesh(new THREE.BoxGeometry(.9,.65,1.35),m);body.position.y=.65;g.add(body);
              const head=new THREE.Mesh(new THREE.BoxGeometry(.65,.65,.65),m);head.position.set(0,1.05,.72);g.add(head);
              for(let i=0;i<4;i++){const leg=new THREE.Mesh(new THREE.BoxGeometry(.18,.55,.18),m);leg.position.set((i%2?-.3:.3),.28,(i<2?-.43:.43));g.add(leg)}
              if(['Cow','Sheep','Goat','Llama'].includes(type)){const a=new THREE.Mesh(new THREE.BoxGeometry(.18,.18,.18),dark);a.position.set(-.28,1.18,.98);g.add(a);const b=a.clone();b.position.x=.28;g.add(b)}
              if(type==='Chicken'){head.material=white;const beak=new THREE.Mesh(new THREE.BoxGeometry(.2,.14,.25),mat(0xe7a52b));beak.position.set(0,1.05,1.08);g.add(beak)}
              g.position.set(x,0,z);root.add(g);live.push(g);return g;
            }
            for(let i=0;i<30;i++){const a=animals[i%animals.length];const x=((i*37)%90)-45,z=((i*53)%90)-45;if(Math.hypot(x,z)<9)continue;mob(a,x,z)}
            const badge=document.createElement('div');badge.className='mmNight';badge.id='mmNight';document.body.appendChild(badge);
            const hp=document.createElement('div');hp.className='mmHealth';hp.textContent='❤ 20/20';document.body.appendChild(hp);
            let ticks=0,day=0;
            function night(){day=(day+.0008)%1;const sun=window.sun;if(sun){const ang=day*Math.PI*2;sun.position.set(Math.cos(ang)*30,Math.sin(ang)*30,10);sun.intensity=Math.max(.12,.35+Math.max(0,Math.sin(ang))*1.8);if(window.scene)scene.background=new THREE.Color(Math.sin(ang)>0?0x79c5ef:0x07101e)}badge.textContent=(Math.sin(day*Math.PI*2)>0?'☀ DAY':'☾ NIGHT')+' • '+Math.floor(day*24000).toString().padStart(5,'0')}
            function drops(g){const d=document.createElement('div');d.className='mmDrop';d.textContent='+'+g.userData.drop;d.style.left='50%';d.style.top='45%';document.body.appendChild(d);setTimeout(()=>d.remove(),1200);}
            window.mainmetDamageMob=function(){let best=null,dist=3;for(const g of live){if(!g.parent)continue;const dx=g.position.x-(window.player?.feet?.x||0),dz=g.position.z-(window.player?.feet?.z||0),dd=Math.hypot(dx,dz);if(dd<dist){dist=dd;best=g}}if(best){best.userData.health-=5;if(best.userData.health<=0){drops(best);best.parent.remove(best)}}};
            document.addEventListener('keydown',e=>{if(e.code==='KeyF')window.mainmetDamageMob()});
            function loop(){ticks++;night();if(ticks%30===0){for(const g of live){if(!g.parent)continue;g.rotation.y+=Math.sin(ticks*.03+g.id)*.015;g.position.x+=Math.sin(ticks*.01+g.id)*.002;g.position.z+=Math.cos(ticks*.013+g.id)*.002}}requestAnimationFrame(loop)}loop();
          })();
          </script>'''
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Validate and commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('play.html').read_text(encoding='utf-8')
          for x in ['MAINMET_FULL_MOBS_V1','MAINMET_FULL_MOBS_CSS','mainmetDamageMob','Cow','Pig','Sheep','Chicken','Horse','Bee','Axolotl']:
            assert x in s,x
          assert s.count('MAINMET_FULL_MOBS_V1')==1
          print('Full Minecraft systems validated')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play.html .github/workflows/full-minecraft-systems.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add animals day night survival damage and drops'
          git push
