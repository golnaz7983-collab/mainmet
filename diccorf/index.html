<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#229ed9"><meta name="description" content="Diccorf Messenger"><link rel="manifest" href="manifest.json"><title>Diccorf</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Tahoma,Arial,sans-serif;background:#dfe9ef;color:#17212b}button,input{font:inherit}.app{height:100dvh;max-width:1280px;margin:auto;background:#fff;display:flex;flex-direction:column;overflow:hidden}.top{height:64px;flex:none;background:#229ed9;color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px}.logo{width:42px;height:42px;border-radius:50%;background:#fff;color:#229ed9;display:grid;place-items:center;font-size:23px;font-weight:900;transform:rotate(-12deg)}.brand{font-size:21px;font-weight:900}.status{font-size:12px;opacity:.85}.grow{flex:1}.topbtn{border:0;background:#fff;color:#168bc4;border-radius:11px;padding:9px 12px;cursor:pointer}.iconbtn{width:40px;height:40px;border:0;border-radius:50%;background:#168fc8;color:#fff;cursor:pointer;font-size:21px}.main{flex:1;min-height:0;display:flex}.side{width:350px;border-left:1px solid #dce2e6;display:flex;flex-direction:column;background:#fff}.sidehead{padding:12px;display:flex;gap:8px;background:#f5f7f8}.search{flex:1;border:0;background:#e9eef1;border-radius:22px;padding:11px 15px;outline:0}.contacts{overflow:auto;flex:1}.contact{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid #eef1f3;cursor:pointer}.contact:hover,.contact.active{background:#eef7fc}.avatar{width:48px;height:48px;flex:none;border-radius:50%;background:#63b5da;color:#fff;display:grid;place-items:center;font-weight:900;font-size:19px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.ct{min-width:0;flex:1}.row{display:flex;gap:7px;align-items:center}.name{font-weight:800;flex:1}.time,.last{font-size:11px;color:#8a969d}.last{margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat{flex:1;min-width:0;display:flex;flex-direction:column;background:#e8f1f5}.chathead{height:64px;background:#fff;border-bottom:1px solid #dce2e6;display:flex;align-items:center;padding:0 16px;gap:10px}.chatback{display:none}.headname{font-weight:900}.headstatus{font-size:11px;color:#35a16c}.chattools{display:flex;gap:6px}.empty{margin:auto;color:#8a969d;text-align:center}.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:3px}.bubble{max-width:min(75%,520px);padding:9px 12px;border-radius:15px;line-height:1.75;white-space:pre-wrap;box-shadow:0 1px 1px #00000009}.me{align-self:flex-start;background:#d7f8c5;border-bottom-right-radius:4px}.them{align-self:flex-end;background:#fff;border-bottom-left-radius:4px}.bubble img{max-width:260px;border-radius:12px;display:block}.composer{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid #dce2e6;align-items:center}.composer input{flex:1;border:0;background:#f1f3f4;border-radius:23px;padding:12px 16px;outline:0}.round{width:44px;height:44px;border:0;border-radius:50%;cursor:pointer}.attach{background:#eef3f6;color:#168fc8}.send{background:#229ed9;color:#fff}.login{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.login.hide,.modal.hide{display:none}.box{width:min(430px,100%);background:#fff;border-radius:22px;padding:25px;box-shadow:0 25px 70px #0005}.box h2{margin:0 0 8px}.box p{color:#6e777d}.box input,.box select{width:100%;padding:13px;margin:7px 0;border:1px solid #d7dfe4;border-radius:12px;outline:0}.primary{width:100%;border:0;background:#229ed9;color:#fff;padding:13px;border-radius:12px;cursor:pointer;margin-top:8px}.small{font-size:11px;color:#888;line-height:1.7}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:15}.settingsGrid{display:grid;gap:9px}.settingBtn{width:100%;padding:12px;border:0;border-radius:12px;background:#f0f4f6;text-align:right;cursor:pointer}.danger{background:#ffe9e9;color:#c33}.file{display:none}@media(max-width:720px){.side{width:100%}.chat{display:none}.side.hide{display:none}.chat.show{display:flex}.chatback{display:block}.top{height:58px;padding:0 9px}.brand{font-size:18px}.topbtn{padding:7px 9px;font-size:11px}.messages{padding:12px}.bubble{max-width:84%}}
</style></head><body><div class="app"><header class="top"><div class="logo">➤</div><div><div class="brand">Diccorf</div><div class="status">پیام‌رسان وب</div></div><div class="grow"></div><button class="topbtn" id="installBtn">📲 افزودن به صفحه</button><button class="topbtn" id="settingsBtn">⚙️</button></header><main class="main"><aside class="side" id="side"><div class="sidehead"><input id="search" class="search" placeholder="جستجوی گفتگوها"><button class="iconbtn" id="plus" title="گفتگو جدید">+</button></div><div class="contacts" id="contacts"></div></aside><section class="chat" id="chat"><div class="chathead" id="chathead" style="display:none"><button class="iconbtn chatback" id="back">‹</button><div class="avatar" id="headAvatar">D</div><div><div class="headname" id="headName"></div><div class="headstatus" id="headStatus">آنلاین</div></div><div class="grow"></div><div class="chattools"><button class="iconbtn" id="call" title="تماس">📞</button><button class="iconbtn" id="video" title="تماس تصویری">📹</button></div></div><div class="empty" id="empty">یک گفتگو را انتخاب کنید</div><div class="messages" id="messages" style="display:none"></div><div class="composer" id="composer" style="display:none"><input class="file" type="file" id="file" accept="image/*"><button class="round attach" id="attach">📎</button><input id="msg" placeholder="پیام..."><button class="round send" id="send">➤</button></div></section></main></div><div class="login" id="login"><div class="box"><h2>✈️ ورود به Diccorf</h2><p>قبل از ورود، حساب خودت را بساز.</p><input id="phone" inputmode="tel" placeholder="شماره موبایل، مثلاً 09123456789"><input id="display" maxlength="30" placeholder="نام نمایشی"><button class="primary" id="enter">ورود / ساخت حساب</button><p class="small">نسخه آزمایشی: کد پیامکی ارسال نمی‌شود. شماره فقط روی همین مرورگر ذخیره می‌شود.</p></div></div><div class="modal hide" id="settings"><div class="box"><button class="settingBtn" id="closeSettings">✕ بستن</button><h2>⚙️ تنظیمات</h2><p id="accountInfo"></p><div class="settingsGrid"><button class="settingBtn" id="rename">✏️ تغییر نام</button><button class="settingBtn" id="changePhone">📱 تغییر شماره</button><button class="settingBtn" id="addContact">➕ افزودن مخاطب</button><button class="settingBtn" id="newGroup">👥 ساخت گروه</button><button class="settingBtn" id="pickAvatar">🖼️ تغییر عکس پروفایل</button><button class="settingBtn danger" id="logout">🚪 خروج از حساب</button></div><input class="file" type="file" id="avatarFile" accept="image/*"></div></div><script>
const $=id=>document.getElementById(id);const AUTH='diccorf.auth.v3';let user=JSON.parse(localStorage.getItem(AUTH)||'null');let chats=JSON.parse(localStorage.getItem('diccorf.chats.v3')||'null');let selected=null;let deferred=null;
if(!Array.isArray(chats)||!chats.length){chats=[{id:1,name:'دوست من',online:true,avatar:'د',messages:[{text:'سلام 👋 به Diccorf خوش اومدی!',me:false,time:'10:20'},{text:'سلام! تست چت انجام شد 😎',me:true,time:'10:21'}]},{id:2,name:'گروه دوستان',online:true,avatar:'گ',messages:[{text:'گروه آماده است. از + برای ساخت گروه استفاده کن.',me:false,time:'09:40'}]},{id:3,name:'پشتیبانی Diccorf',online:true,avatar:'D',messages:[{text:'اگر مشکلی دیدی همین‌جا پیام بده.',me:false,time:'08:15'}]}];save();}
function save(){localStorage.setItem('diccorf.chats.v3',JSON.stringify(chats));if(user)localStorage.setItem(AUTH,JSON.stringify(user))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){const q=$('search').value.trim().toLowerCase();$('contacts').innerHTML='';chats.filter(c=>(c.name+' '+(c.messages.at(-1)?.text||'')).toLowerCase().includes(q)).forEach(c=>{const el=document.createElement('div');el.className='contact '+(selected===c.id?'active':'');const av=c.photo?'<img src="'+c.photo+'">':esc(c.avatar||c.name[0]||'?');el.innerHTML='<div class="avatar">'+av+'</div><div class="ct"><div class="row"><div class="name">'+esc(c.name)+'</div><div class="time">'+esc(c.messages.at(-1)?.time||'')+'</div></div><div class="last">'+esc(c.messages.at(-1)?.text||'گفتگوی جدید')+'</div></div>';el.onclick=()=>openChat(c.id);$('contacts').appendChild(el)})}
function openChat(id){selected=id;const c=chats.find(x=>x.id===id);if(!c)return;$('empty').style.display='none';$('chathead').style.display='flex';$('messages').style.display='flex';$('composer').style.display='flex';$('headName').textContent=c.name;$('headStatus').textContent=c.online?'🟢 آنلاین':'آخرین بازدید اخیراً';$('headAvatar').textContent=c.avatar||c.name[0];if(c.photo)$('headAvatar').innerHTML='<img src="'+c.photo+'">';$('messages').innerHTML='';c.messages.forEach(m=>{const b=document.createElement('div');b.className='bubble '+(m.me?'me':'them');if(m.image){b.innerHTML='<img src="'+m.image+'"><div>'+esc(m.text||'')+'</div>'}else b.textContent=m.text;$('messages').appendChild(b)});$('messages').scrollTop=$('messages').scrollHeight;render();if(innerWidth<=720){$('side').classList.add('hide');$('chat').classList.add('show')}}
function requireUser(){if(!user){$('login').classList.remove('hide');return false}return true}
function login(){const p=$('phone').value.trim(),n=$('display').value.trim();if(!/^\+?\d{8,15}$/.test(p)){alert('شماره موبایل را درست وارد کن.');return}if(!n){alert('نام نمایشی را وارد کن.');return}user={phone:p,name:n,photo:null};save();$('login').classList.add('hide');render()}
$('enter').onclick=login;$('search').oninput=render;$('back').onclick=()=>{$('side').classList.remove('hide');$('chat').classList.remove('show')};$('settingsBtn').onclick=()=>{if(!requireUser())return;$('accountInfo').textContent='حساب: '+user.name+' • '+user.phone;$('settings').classList.remove('hide')};$('closeSettings').onclick=()=>$('settings').classList.add('hide');$('rename').onclick=()=>{const n=prompt('نام جدید:',user.name);if(n&&n.trim()){user.name=n.trim();save();$('accountInfo').textContent='حساب: '+user.name+' • '+user.phone}};$('changePhone').onclick=()=>{const p=prompt('شماره جدید:',user.phone);if(p&&/^\+?\d{8,15}$/.test(p)){user.phone=p;save();$('accountInfo').textContent='حساب: '+user.name+' • '+user.phone}else if(p)alert('شماره درست نیست.')};function newContact(){if(!requireUser())return;const n=prompt('نام مخاطب را وارد کن:');if(!n)return;chats.unshift({id:Date.now(),name:n.trim(),online:true,avatar:n.trim()[0],messages:[]});save();render();openChat(chats[0].id)}function newGroup(){if(!requireUser())return;const n=prompt('نام گروه را وارد کن:');if(!n)return;chats.unshift({id:Date.now(),name:n.trim(),online:true,avatar:'👥',messages:[{text:'گروه ساخته شد.',me:false,time:now()}]});save();render();openChat(chats[0].id)}$('plus').onclick=()=>{if(!requireUser())return;const x=prompt('1 = مخاطب جدید\n2 = گروه جدید');if(x==='1')newContact();else if(x==='2')newGroup()};$('addContact').onclick=()=>{newContact();$('settings').classList.add('hide')};$('newGroup').onclick=()=>{newGroup();$('settings').classList.add('hide')};function now(){return new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}
function sendText(){if(!requireUser()||selected===null)return;const t=$('msg').value.trim();if(!t)return;const c=chats.find(x=>x.id===selected);c.messages.push({text:t,me:true,time:now()});$('msg').value='';save();openChat(selected);setTimeout(()=>{if(c.name==='پشتیبانی Diccorf')c.messages.push({text:'پیامت دریافت شد ✅',me:false,time:now()});else if(c.name==='دوست من')c.messages.push({text:'پیامت رسید 👌',me:false,time:now()});save();if(selected===c.id)openChat(c.id)},450)}$('send').onclick=sendText;$('msg').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText()}});$('attach').onclick=()=>{if(requireUser())$('file').click()};$('file').onchange=e=>{const f=e.target.files[0];if(!f||selected===null)return;const r=new FileReader();r.onload=()=>{const c=chats.find(x=>x.id===selected);c.messages.push({image:r.result,text:'',me:true,time:now()});save();openChat(selected)};r.readAsDataURL(f)};
$('pickAvatar').onclick=()=>{if(requireUser())$('avatarFile').click()};$('avatarFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{user.photo=r.result;save();$('settings').classList.add('hide');render()};r.readAsDataURL(f)};$('logout').onclick=()=>{localStorage.removeItem(AUTH);user=null;$('settings').classList.add('hide');$('login').classList.remove('hide');};$('call').onclick=()=>alert('📞 تماس در نسخه بعدی با WebRTC و سرور واقعی وصل می‌شود.');$('video').onclick=()=>alert('📹 تماس تصویری در نسخه بعدی با WebRTC و سرور واقعی وصل می‌شود.');$('installBtn').onclick=async()=>{if(deferred){deferred.prompt();deferred=null}else alert('اگر دکمه نصب ظاهر نشد، از منوی مرورگر گزینه Install / Add to Home screen را بزن.')} ;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});
if('BroadcastChannel'in window){const bc=new BroadcastChannel('diccorf-chat');bc.onmessage=e=>{if(e.data==='refresh'){chats=JSON.parse(localStorage.getItem('diccorf.chats.v3')||'[]');render();if(selected!==null)openChat(selected)}};window.diccorfBroadcast=()=>bc.postMessage('refresh')}
window.addEventListener('storage',e=>{if(e.key==='diccorf.chats.v3'){chats=JSON.parse(e.newValue||'[]');render();if(selected!==null)openChat(selected)}});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
if(!user){$('login').classList.remove('hide')}else{$('login').classList.add('hide');render()}
</script></body></html>
