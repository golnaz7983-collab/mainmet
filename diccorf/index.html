<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#229ed9"><link rel="manifest" href="manifest.json"><title>Diccorf</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#dfe9ef;color:#222}.app{height:100vh;display:flex;flex-direction:column;max-width:1250px;margin:auto;background:#fff}.top{height:64px;background:#229ed9;color:#fff;display:flex;align-items:center;padding:0 18px;gap:12px}.logo{width:42px;height:42px;border-radius:50%;background:#fff;color:#229ed9;display:grid;place-items:center;font-size:23px;font-weight:900}.brand{font-size:20px;font-weight:900}.grow{flex:1}.topbtn{border:0;background:#fff;color:#168bc4;border-radius:12px;padding:9px 12px;cursor:pointer}.main{flex:1;display:flex;min-height:0}.side{width:350px;border-left:1px solid #ddd;display:flex;flex-direction:column}.sidehead{padding:12px;background:#f7f8f9;display:flex;align-items:center;gap:8px}.search{flex:1;border:0;background:#e9eef1;border-radius:20px;padding:10px 14px;outline:0}.circle{border:0;border-radius:50%;width:40px;height:40px;background:#229ed9;color:#fff;font-size:24px;cursor:pointer}.contacts{overflow:auto}.contact{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid #eee;cursor:pointer}.contact:hover{background:#f4f8fa}.avatar{width:48px;height:48px;border-radius:50%;background:#65b7dc;color:#fff;display:grid;place-items:center;font-weight:900}.ct{flex:1}.name{font-weight:800}.last{font-size:12px;color:#888;margin-top:5px}.chat{flex:1;display:flex;flex-direction:column;min-width:0}.empty{margin:auto;color:#888;text-align:center}.messages{flex:1;overflow:auto;padding:20px;background:#eaf2f6}.bubble{max-width:75%;padding:10px 13px;border-radius:15px;margin:6px 0;line-height:1.8}.me{margin-right:auto;background:#d8f8c6;border-bottom-right-radius:4px}.them{margin-left:auto;background:#fff;border-bottom-left-radius:4px}.composer{display:flex;gap:8px;padding:12px;background:#fff;border-top:1px solid #ddd}.composer input{flex:1;border:0;background:#f1f3f4;border-radius:22px;padding:12px 16px;outline:0}.send{border:0;background:#229ed9;color:#fff;border-radius:50%;width:46px;cursor:pointer}.attach{border:0;background:#eef3f6;border-radius:50%;width:42px;cursor:pointer;font-size:20px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.box{background:#fff;border-radius:22px;padding:24px;width:min(430px,100%);box-shadow:0 20px 60px #0004}.box input{width:100%;margin:8px 0;padding:12px;border:1px solid #ddd;border-radius:12px}.primary{width:100%;border:0;background:#229ed9;color:#fff;padding:12px;border-radius:12px;cursor:pointer;margin-top:8px}.secondary{width:100%;border:0;background:#eef3f6;color:#222;padding:12px;border-radius:12px;cursor:pointer;margin-top:8px}.close{float:left;border:0;background:none;font-size:22px;cursor:pointer}.settingsRow{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #eee}.hidden{display:none}@media(max-width:720px){.side{width:100%}.chat{display:none}.side.hide{display:none}.chat.show{display:flex}.top{height:58px;padding:0 10px}.topbtn{font-size:11px;padding:8px}.sidehead{padding:10px}}
</style></head><body><div class="app"><header class="top"><div class="logo">➤</div><div class="brand">Diccorf</div><div class="grow"></div><button class="topbtn" id="accountBtn">👤 حساب</button><button class="topbtn" id="installBtn">📲 نصب</button></header><main class="main"><aside class="side" id="side"><div class="sidehead"><input class="search" id="search" placeholder="جستجوی گفتگوها"><button class="circle" id="plus">+</button><button class="circle" id="settingsBtn">⚙</button></div><div class="contacts" id="contacts"></div></aside><section class="chat" id="chat"><div class="empty" id="empty">یک گفتگو را انتخاب کنید</div><div class="messages" id="messages" style="display:none"></div><div class="composer" id="composer" style="display:none"><input id="file" type="file" accept="image/*" class="hidden"><button class="attach" id="attach">📷</button><input id="msg" placeholder="پیام..."><button class="send" id="send">➤</button></div></section></main></div><div class="modal" id="login"><div class="box"><button class="close" id="close">×</button><h2>ورود به Diccorf</h2><p>قبل از ورود، شماره موبایل خودت را وارد کن.</p><input id="phone" inputmode="tel" autocomplete="tel" placeholder="مثلاً 09123456789"><input id="displayName" placeholder="نام نمایشی"><button class="primary" id="enter">ورود / ساخت حساب</button><small>نسخه آزمایشی: کد پیامکی ارسال نمی‌شود.</small></div></div><div class="modal" id="settings"><div class="box"><button class="close" id="settingsClose">×</button><h2>⚙ تنظیمات Diccorf</h2><div class="settingsRow"><span>شماره حساب</span><b id="accountPhone">—</b></div><div class="settingsRow"><span>نام نمایشی</span><b id="accountName">—</b></div><button class="primary" id="changeName">تغییر نام</button><button class="secondary" id="logout">خروج از حساب</button></div></div><div class="modal" id="plusModal"><div class="box"><button class="close" id="plusClose">×</button><h2>➕ ایجاد</h2><button class="primary" id="newContact">👤 افزودن مخاطب</button><button class="secondary" id="newGroup">👥 ساخت گروه</button></div></div><script>const $=x=>document.getElementById(x);let account=JSON.parse(localStorage.getItem('diccorf.account')||'null');let selected=null;let deferred=null;const chats=JSON.parse(localStorage.getItem('diccorf.chats')||'[]');function save(){localStorage.setItem('diccorf.chats',JSON.stringify(chats))}function show(id){$(id).style.display='flex'}function hide(id){$(id).style.display='none'}function ensure(){if(!account){show('login');return false}return true}function render(){const list=$('contacts');list.innerHTML='';chats.forEach((c,i)=>{const el=document.createElement('div');el.className='contact';const initial=(c.name||'گفتگو').trim()[0]||'?';el.innerHTML='<div class="avatar">'+initial+'</div><div class="ct"><div class="name">'+escapeHtml(c.name||'گفتگو')+'</div><div class="last">'+escapeHtml(c.messages?.at(-1)?.text||'گفتگوی جدید')+'</div></div>';el.onclick=()=>openChat(i);list.appendChild(el)})}function escapeHtml(s){return String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]||m))}function openChat(i){if(!ensure())return;selected=i;$('empty').style.display='none';$('messages').style.display='block';$('composer').style.display='flex';$('messages').innerHTML='';(chats[i].messages||[]).forEach(m=>{const b=document.createElement('div');b.className='bubble '+(m.me?'me':'them');b.textContent=m.text;$('messages').appendChild(b)});$('messages').scrollTop=$('messages').scrollHeight;if(innerWidth<=720){$('side').classList.add('hide');$('chat').classList.add('show')}}function login(){const p=$('phone').value.trim();const n=$('displayName').value.trim()||'کاربر Diccorf';if(!/^\+?\d{8,15}$/.test(p)){alert('شماره موبایل را درست وارد کن.');return}account={phone:p,name:n};localStorage.setItem('diccorf.account',JSON.stringify(account));hide('login');render()}function init(){if(!account){show('login')}else render()}$('enter').onclick=login;$('close').onclick=()=>{if(account)hide('login')};$('plus').onclick=()=>{if(ensure())show('plusModal')};$('plusClose').onclick=()=>hide('plusModal');$('newContact').onclick=()=>{const name=prompt('نام مخاطب را وارد کن:');if(name){chats.push({name,messages:[]});save();render();hide('plusModal')}};$('newGroup').onclick=()=>{const name=prompt('نام گروه را وارد کن:');if(name){chats.push({name:'👥 '+name,messages:[]});save();render();hide('plusModal')}};$('send').onclick=()=>{const t=$('msg').value.trim();if(!t||selected===null)return;chats[selected].messages.push({text:t,me:true});save();$('msg').value='';openChat(selected)};$('msg').addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click()});$('attach').onclick=()=>{if(ensure())$('file').click()};$('file').onchange=()=>{const f=$('file').files[0];if(f&&selected!==null){chats[selected].messages.push({text:'🖼️ عکس انتخاب شد: '+f.name,me:true});save();openChat(selected)}};$('settingsBtn').onclick=()=>{if(!ensure())return;$('accountPhone').textContent=account.phone;$('accountName').textContent=account.name;show('settings')};$('settingsClose').onclick=()=>hide('settings');$('changeName').onclick=()=>{const n=prompt('نام جدید:',account.name);if(n&&n.trim()){account.name=n.trim();localStorage.setItem('diccorf.account',JSON.stringify(account));$('accountName').textContent=account.name;render()}};$('logout').onclick=()=>{localStorage.removeItem('diccorf.account');location.reload()};$('accountBtn').onclick=()=>{if(!ensure())return;$('accountPhone').textContent=account.phone;$('accountName').textContent=account.name;show('settings')};$('installBtn').onclick=async()=>{if(deferred){deferred.prompt();deferred=null}else alert('اگر نصب خودکار نمایش داده نشد، از منوی مرورگر گزینه Install/Add to Home screen را انتخاب کن.')}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});init();</script></body></html>
