<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#229ed9"><link rel="manifest" href="manifest.json"><title>Diccorf</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#dfe9ef;color:#222}.app{height:100vh;display:flex;flex-direction:column;max-width:1250px;margin:auto;background:#fff}.top{height:64px;background:#229ed9;color:#fff;display:flex;align-items:center;padding:0 18px;gap:14px}.logo{width:42px;height:42px;border-radius:50%;background:#fff;color:#229ed9;display:grid;place-items:center;font-size:23px;font-weight:900}.brand{font-size:20px;font-weight:900}.top .grow{flex:1}.install{border:0;background:#fff;color:#168bc4;border-radius:12px;padding:9px 13px;cursor:pointer}.main{flex:1;display:flex;min-height:0}.side{width:340px;border-left:1px solid #ddd;display:flex;flex-direction:column}.sidehead{padding:15px;background:#f7f8f9;display:flex;align-items:center;gap:8px}.search{flex:1;border:0;background:#e9eef1;border-radius:20px;padding:10px 14px;outline:0}.plus{border:0;border-radius:50%;width:40px;height:40px;background:#229ed9;color:white;font-size:25px;cursor:pointer}.contacts{overflow:auto}.contact{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid #eee;cursor:pointer}.contact:hover{background:#f4f8fa}.avatar{width:48px;height:48px;border-radius:50%;background:#65b7dc;color:#fff;display:grid;place-items:center;font-weight:900}.ct{flex:1}.name{font-weight:800}.last{font-size:12px;color:#888;margin-top:5px}.chat{flex:1;display:flex;flex-direction:column;min-width:0}.empty{margin:auto;color:#888;text-align:center}.messages{flex:1;overflow:auto;padding:20px;background:#eaf2f6}.bubble{max-width:75%;padding:10px 13px;border-radius:15px;margin:6px 0;line-height:1.8}.me{margin-right:auto;background:#d8f8c6;border-bottom-right-radius:4px}.them{margin-left:auto;background:#fff;border-bottom-left-radius:4px}.composer{display:flex;gap:8px;padding:12px;background:#fff;border-top:1px solid #ddd}.composer input{flex:1;border:0;background:#f1f3f4;border-radius:22px;padding:12px 16px;outline:0}.send{border:0;background:#229ed9;color:#fff;border-radius:50%;width:46px;cursor:pointer}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.box{background:#fff;border-radius:22px;padding:24px;width:min(420px,100%);box-shadow:0 20px 60px #0004}.box input{width:100%;margin:8px 0;padding:12px;border:1px solid #ddd;border-radius:12px}.primary{width:100%;border:0;background:#229ed9;color:#fff;padding:12px;border-radius:12px;cursor:pointer;margin-top:8px}.close{float:left;border:0;background:none;font-size:22px}@media(max-width:720px){.side{width:100%}.chat{display:none}.side.hide{display:none}.chat.show{display:flex}.top{height:58px}.sidehead{padding:10px}.install{font-size:12px}}
</style></head><body><div class="app"><header class="top"><div class="logo">➤</div><div class="brand">Diccorf</div><div class="grow"></div><button class="install" id="installBtn">📲 افزودن به صفحه</button></header><main class="main"><aside class="side" id="side"><div class="sidehead"><input class="search" placeholder="جستجوی گفتگوها"><button class="plus" id="plus">+</button></div><div class="contacts" id="contacts"></div></aside><section class="chat" id="chat"><div class="empty" id="empty">یک گفتگو را انتخاب کنید</div><div class="messages" id="messages" style="display:none"></div><div class="composer" id="composer" style="display:none"><button class="send" id="send">➤</button><input id="msg" placeholder="پیام..."></div></section></main></div><div class="modal" id="login"><div class="box"><button class="close" id="close">×</button><h2>ورود به Diccorf</h2><p>شماره موبایل خود را وارد کنید.</p><input id="phone" inputmode="tel" placeholder="مثلاً 09123456789"><button class="primary" id="enter">ورود / ساخت حساب</button><small>در این نسخه آزمایشی کد پیامکی ارسال نمی‌شود.</small></div></div><script>const $=x=>document.getElementById(x);let user=localStorage.getItem('diccorf.user');let selected=null;let deferred=null;const chats=JSON.parse(localStorage.getItem('diccorf.chats')||'[]');function save(){localStorage.setItem('diccorf.chats',JSON.stringify(chats))}function render(){const list=$('contacts');list.innerHTML='';chats.forEach((c,i)=>{const el=document.createElement('div');el.className='contact';el.innerHTML='<div class="avatar">'+(c.name||'?')[0]+'</div><div class="ct"><div class="name">'+(c.name||'گفتگو')+'</div><div class="last">'+(c.messages?.at(-1)?.text||'گفتگوی جدید')+'</div></div>';el.onclick=()=>openChat(i);list.appendChild(el)})}function openChat(i){selected=i;$('empty').style.display='none';$('messages').style.display='block';$('composer').style.display='flex';$('messages').innerHTML='';(chats[i].messages||[]).forEach(m=>{const b=document.createElement('div');b.className='bubble '+(m.me?'me':'them');b.textContent=m.text;$('messages').appendChild(b)});if(innerWidth<=720){$('side').classList.add('hide');$('chat').classList.add('show')}}function login(){const p=$('phone').value.trim();if(!p)return;if(!/^\+?\d{8,15}$/.test(p))return alert('شماره موبایل را درست وارد کن.');user=p;localStorage.setItem('diccorf.user',p);$('login').style.display='none';render()}function init(){if(!user)$('login').style.display='flex';else render()}$('enter').onclick=login;$('close').onclick=()=>$('login').style.display='none';$('plus').onclick=()=>{if(!user){$('login').style.display='flex';return}const name=prompt('نام مخاطب یا گروه:');if(name){chats.push({name,messages:[]});save();render()}};$('send').onclick=()=>{const t=$('msg').value.trim();if(!t||selected===null)return;chats[selected].messages.push({text:t,me:true});save();$('msg').value='';openChat(selected)};$('msg').addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click()});$('installBtn').onclick=async()=>{if(deferred){deferred.prompt();deferred=null}else alert('از منوی مرورگر گزینه نصب یا Add to Home screen را بزن.')}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');init();</script></body></html>
