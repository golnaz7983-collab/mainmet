<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نبض بازار ایران</title><style>body{margin:0;background:#f5f6f8;color:#171717;font-family:Tahoma,Arial}.wrap{max-width:1100px;margin:auto;padding:25px}.top{background:#fff;border-radius:18px;padding:22px;box-shadow:0 5px 25px #0000000d;margin-bottom:18px}.top h1{margin:0 0 8px}.muted{color:#777}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 5px 20px #0000000b}.name{font-weight:800}.price{font-size:25px;font-weight:900;margin:12px 0}.change{font-weight:800}.up{color:#159447}.down{color:#d93636}.time{font-size:12px;color:#888}.actions{margin-top:15px}.btn{border:0;border-radius:10px;padding:10px 16px;background:#171717;color:#fff;cursor:pointer}.foot{text-align:center;color:#888;margin:25px}.notice{background:#fff7d6;padding:12px;border-radius:12px;margin-top:15px;font-size:13px;line-height:1.8}</style></head><body><div class="wrap"><section class="top"><h1>📈 نبض بازار ایران</h1><div class="muted">دلار، طلا، نقره و آهن</div><div class="actions"><button class="btn" onclick="load()">🔄 بروزرسانی</button></div><div class="notice">قیمت‌ها از سرویس‌های عمومی بازار خوانده می‌شوند و ممکن است با تأخیر یا اختلاف منبع همراه باشند.</div></section><main id="grid" class="grid"></main><div class="foot">ArMa Market • نمایش قیمت‌ها به تومان</div></div><script>const items=[['USD','💵 دلار آمریکا'],['GOLD18','🥇 طلای ۱۸ عیار'],['SILVER925','🥈 نقره ۹۲۵'],['IRON','🔩 آهن']];function card(k,n,p,c,t){return `<article class="card"><div class="name">${n}</div><div class="price">${p}</div><div class="change ${c==='up'?'up':c==='down'?'down':''}">${c==='up'?'▲':c==='down'?'▼':'—'} تغییر</div><div class="time">آخرین دریافت: ${t}</div></article>`}function fallback(){const d=[['USD','💵 دلار آمریکا','در حال دریافت…',''],['GOLD18','🥇 طلای ۱۸ عیار','در حال دریافت…',''],['SILVER925','🥈 نقره ۹۲۵','در حال دریافت…',''],['IRON','🔩 آهن','در حال دریافت…','']];$('grid').innerHTML=d.map(x=>card(...x,new Date().toLocaleTimeString('fa-IR'))).join('')}function $(x){return document.getElementById(x)}async function load(){fallback();try{const r=await fetch('https://persiantoolbox.ir/api/market',{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();const d=j.data||j;const get=(o)=>o?.rate??o?.price??o?.value??o?.latest?.sell;const find=(keys)=>{for(const k of keys){const x=d[k]||d[k.toLowerCase()]||d.metals?.[k]||d.gold?.[k]||d.silver?.[k];if(x)return x}return null};const usd=find(['USD','usd']);const gold=find(['GOLD18','gold18','gold_18k','geram18']);const sil=find(['SILVER925','silver925','silver_925']);const iron=find(['IRON','iron']);const arr=[['💵 دلار آمریکا',usd],['🥇 طلای ۱۸ عیار',gold],['🥈 نقره ۹۲۵',sil],['🔩 آهن',iron]];$('grid').innerHTML=arr.map(([n,x])=>{let p=get(x);return card('',n,p==null?'داده موجود نیست':Number(p).toLocaleString('fa-IR')+' تومان','','',new Date().toLocaleTimeString('fa-IR'))}).join('')}catch(e){$('grid').innerHTML='<article class="card"><b>اتصال قیمت زنده برقرار نشد.</b><p class="muted">دوباره روی بروزرسانی بزن.</p></article>'}}load();setInterval(load,60000);</script></body></html>
